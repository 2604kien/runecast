[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/runes.json,data/enemies.json,data/production_boards.json,data/production_loadouts.json,data/production_rules.json,data/production_encounter.json,data/production_next_encounter.json,data/production_transition_encounter.json,assets/fonts/ATTRIBUTION.txt,assets/fonts/ui/OFL.NotoSerif.txt"
exclude_filter="docs/*,output/*,tools/*,tests/*,.tools/*,.local/*,source-assets/*,builds/*,scripts/dev/*,data/development/*,data/board_examples.json,data/dev_encounter.json,data/boards.json,data/loadouts.json,data/encounter.json,export_templates/*,feature_profiles/*,script_templates/*,text_editor_themes/*"
export_path="builds/android/RuneCast-debug.apk"
script_export_mode=2

[preset.0.options]
gradle_build/use_gradle_build=false
; Prebuilt official APK supplies minimum/target SDK; inspect the built manifest.
; These Gradle fields are intentionally unused for this local debug path.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.example.runecast"
package/name="Rune Cast"
package/signed=true
permissions/internet=false
permissions/access_network_state=false
permissions/record_audio=false
permissions/read_external_storage=false
permissions/write_external_storage=false
version/code=1
version/name="0.1.0"

[preset.1]
name="iOS"
platform="iOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/runes.json,data/enemies.json,data/production_boards.json,data/production_loadouts.json,data/production_rules.json,data/production_encounter.json,data/production_next_encounter.json,data/production_transition_encounter.json,assets/fonts/ATTRIBUTION.txt,assets/fonts/ui/OFL.NotoSerif.txt"
exclude_filter="docs/*,output/*,tools/*,tests/*,.tools/*,.local/*,source-assets/*,builds/*,scripts/dev/*,data/development/*,data/board_examples.json,data/dev_encounter.json,data/boards.json,data/loadouts.json,data/encounter.json,export_templates/*,feature_profiles/*,script_templates/*,text_editor_themes/*"
export_path="builds/ios/RuneCast.zip"
script_export_mode=2

[preset.1.options]
architectures/arm64=true
; tools/ios.py supplies the owner's development identity in a fresh staged copy.
; Blank source values deliberately prevent use of an unapproved placeholder.
application/bundle_identifier=""
application/app_store_team_id=""
application/short_version="0.1.0"
application/version="1"
application/export_method_debug=1
application/code_sign_identity_debug="Apple Development"
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
; Godot 4.7.2's actual toolchain default, not a verified minimum device OS.
application/min_ios_version="15.0"
; Godot enum 0 = iPhone; landscape and a separate tablet UI remain out of scope.
application/targeted_device_family=0
