<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230"><title>r002 actual Noto Serif and Spark review; editable text</title><rect width="1100" height="1230" fill="#122137"/><text x="32" y="50.56" font-family="Noto Serif" font-size="32" font-weight="600" fill="#e9b55c" stroke="#08121e" stroke-width="4" paint-order="stroke fill">RUNE CAST / COMBAT TYPE REVISION</text><text x="32" y="92.28" font-family="Noto Serif" font-size="16" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Actual Noto Serif · weight600 / width100 · official font and OFL obtained</text><text x="32" y="121.28" font-family="Noto Serif" font-size="16" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Cream lettering, dark outside stroke, large action hierarchy; no system substitute.</text><path d="M32 143 H1068" stroke="#88734c"/><text x="32" y="193.88" font-family="Noto Serif" font-size="36" font-weight="600" fill="#edb152" stroke="#08121e" stroke-width="4" paint-order="stroke fill">RUNE CAST</text><text x="355" y="191.43" font-family="Noto Serif" font-size="21" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Floor 3 · Ashen Crypt</text><text x="32" y="263.07" font-family="Noto Serif" font-size="29" font-weight="600" fill="#61e5bc" stroke="#08121e" stroke-width="4" paint-order="stroke fill">CIRCUIT COMPLETE</text><text x="32" y="351.84" font-family="Noto Serif" font-size="48" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="6" paint-order="stroke fill">CAST</text><text x="300" y="365.54" font-family="Noto Serif" font-size="38" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="4" paint-order="stroke fill">2</text><text x="420" y="355.54" font-family="Noto Serif" font-size="38" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="4" paint-order="stroke fill">Resume</text><text x="760" y="355.54" font-family="Noto Serif" font-size="38" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="4" paint-order="stroke fill">Continue</text><text x="32" y="410.6" font-family="Noto Serif" font-size="20" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Spark</text><text x="207" y="410.6" font-family="Noto Serif" font-size="20" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Free Spark</text><text x="410" y="410.6" font-family="Noto Serif" font-size="20" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Conjure Spark</text><text x="697" y="409.56" font-family="Noto Serif" font-size="32" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="4" paint-order="stroke fill">6    0    8    1</text><text x="32" y="463.11" font-family="Noto Serif" font-size="17" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">SPARK</text><text x="205" y="458.92" font-family="Noto Serif" font-size="24" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">0 / 6</text><text x="410" y="458.92" font-family="Noto Serif" font-size="24" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">32 / 32</text><text x="695" y="464.43" font-family="Noto Serif" font-size="21" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Menu    Map    Guide</text><text x="32" y="518.6" font-family="Noto Serif" font-size="20" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Cancel selection     Details / Pass</text><text x="530" y="518.6" font-family="Noto Serif" font-size="20" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Confirm Pass / enemy acts</text><path d="M32 548 H1068" stroke="#88734c"/><text x="32" y="593.92" font-family="Noto Serif" font-size="24" font-weight="600" fill="#edb152" stroke="#08121e" stroke-width="2" paint-order="stroke fill">SPARK / LONG AMBER RAYS + YELLOW CENTER</text><text x="32" y="632.11" font-family="Noto Serif" font-size="17" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Exact editable SVG · no baked ports, labels, cost or effect value</text><text x="40" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">24px canvas</text><image href="spark.svg" x="40" y="710" width="24" height="24"/><text x="214" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">32px canvas</text><image href="spark.svg" x="214" y="710" width="32" height="32"/><text x="388" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">48px canvas</text><image href="spark.svg" x="388" y="710" width="48" height="48"/><text x="562" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">62px canvas</text><image href="spark.svg" x="562" y="710" width="62" height="62"/><text x="736" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">80px canvas</text><image href="spark.svg" x="736" y="710" width="80" height="80"/><text x="910" y="676.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">128px canvas</text><image href="spark.svg" x="910" y="710" width="128" height="128"/><text x="32" y="879.94" font-family="Noto Serif" font-size="18" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Gameplay recommendation: 80px canvas gives a 60px visible sun in a 137px cell.</text><text x="32" y="911.11" font-family="Noto Serif" font-size="17" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">62px canvas gives a 46px sun. The earlier 48px canvas made the symbol too small.</text><path d="M32 933 H1068" stroke="#88734c"/><text x="32" y="974.26" font-family="Noto Serif" font-size="22" font-weight="600" fill="#edb152" stroke="#08121e" stroke-width="2" paint-order="stroke fill">137px CELL / TWO SCALE OPTIONS</text><rect x="40" y="1010" width="137" height="137" fill="#372719" stroke="#bb8a41" stroke-width="3"/><text x="49" y="1034.11" font-family="Noto Serif" font-size="17" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">SPARK</text><image href="spark.svg" x="77" y="1039" width="62" height="62"/><text x="98" y="1137.92" font-family="Noto Serif" font-size="24" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">6</text><text x="40" y="1174.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">62px sun canvas</text><rect x="260" y="1010" width="137" height="137" fill="#372719" stroke="#bb8a41" stroke-width="3"/><text x="269" y="1034.11" font-family="Noto Serif" font-size="17" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">SPARK</text><image href="spark.svg" x="288" y="1039" width="80" height="80"/><text x="318" y="1137.92" font-family="Noto Serif" font-size="24" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">6</text><text x="260" y="1174.45" font-family="Noto Serif" font-size="15" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">80px sun canvas</text><text x="515" y="1034.43" font-family="Noto Serif" font-size="21" font-weight="600" fill="#fff0ca" stroke="#08121e" stroke-width="2" paint-order="stroke fill">Reference direction</text><text x="515" y="1070.94" font-family="Noto Serif" font-size="18" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Brighter center; long visible amber rays.</text><text x="515" y="1102.94" font-family="Noto Serif" font-size="18" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Thin warm edge preserves sun silhouette.</text><text x="515" y="1134.94" font-family="Noto Serif" font-size="18" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">Ports stay separate atN/E/S/W edge centers.</text><text x="515" y="1166.94" font-family="Noto Serif" font-size="18" font-weight="400" fill="#fff0ca" stroke="#08121e" stroke-width="0" paint-order="stroke fill">No owner approval or integration inferred.</text></svg>