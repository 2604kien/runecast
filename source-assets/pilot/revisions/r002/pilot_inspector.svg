4" font-family="Noto Serif" font-size="23" font-weight="600" fill="#f4e7c6" stroke="#101016" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill" text-anchor="start">Permanent rune; after</text><text x="32" y="440" font-family="Noto Serif" font-size="23" font-weight="600" fill="#f4e7c6" stroke="#101016" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill" text-anchor="start">Cast / Pass it discards.</text><rect x="320" y="148" width="7" height="320" rx="3" fill="#0c1c2b" stroke="none" stroke-width="1"/><rect x="320" y="153" width="7" height="173" rx="3" fill="#8092a0" stroke="none" stroke-width="1"/><image xlink:href="review_resources/button_secondary_296x64_normal_standard.png" x="32" y="482" width="296" height="64"/><text x="180.0" y="521.48" font-family="Noto Serif" font-size="22" font-weight="600" fill="#ffedb7" stroke="#101016" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill" text-anchor="middle">Close</text><text x="18" y="605" font-family="Noto Serif" font-size="13" font-weight="600" fill="#b7c3d0" stroke="#101016" stroke-width="1.5" stroke-linejoin="round" paint-order="stroke fill" text-anchor="start">Inspector body scrolls; Close stays fixed.</text><text x="18" y="627" font-family="Noto Serif" font-size="13" font-weight="600" fill="#b7c3d0" stroke="#101016" stroke-width="1.5" stroke-linejoin="round" paint-order="stroke fill" text-anchor="start">No card activation in this panel.</text></svg>